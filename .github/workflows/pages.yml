name: Publicar Scanner B3

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '15 14-20 * * 1-5'
    - cron: '0 21 * * 1-5'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Obter aplicação
        uses: actions/checkout@v6
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Atualizar análise de mercado
        env:
          BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}
          DAILY_REVIEW: ${{ github.event_name == 'schedule' && github.event.schedule == '0 21 * * 1-5' }}
        run: python3 scripts/generate_signals.py
      - name: Persistir histórico simulado
        run: |
          git config user.name "scanner-b3-bot"
          git config user.email "scanner-b3-bot@users.noreply.github.com"
          git add tracking.json market_cache.json dividends.json macro.json
          git diff --cached --quiet || git commit -m "Atualizar acompanhamento simulado [skip ci]"
          git push
      - name: Preparar arquivos
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
